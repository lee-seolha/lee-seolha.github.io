title: Color Picker

<style>
    input[type=color]{
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      appearance: auto;
      inline-size: 50px;
    }
    
    label {
      padding: 5px 5px 5px 0;
      display: inline-block;
    }

    #reset-button {
      padding: 0.3em;
      cursor: pointer;
      color: black;
      font-family: 'Open Sans', sans-serif;
      inline-size: 100px;
      margin-top: 10px;
    }
        
    .color-picker-container {
      border-radius: 5px;
      border: 1.50px solid;
      padding: 10px 20px;
      width: 30em;
      margin-bottom: 1.6em;
    }
    
    .col-label, .col-color {
      float: left;
      width: 50%;
      margin-top: 6px;
    }
    
    /* .col-color {
      float: left;
      width: 50%;
      margin-top: 6px;
    } */
    
    /* Clear floats after the columns */
    .row:after {
      content: "";
      display: table;
      clear: both;
    }
    
    /* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other */
    @media screen and (max-width: 768px) {
      .col-label, .col-color, #reset-button {
        width: 100%;
        margin-top: 0;
      }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Function to get cookie value by name
        function getCookie(name) {
            let matches = document.cookie.match(new RegExp(
                "(?:^|; )" + name.replace(/([.$?*|{}()\[\]\/\\+^])/g, '\\$1') + "=([^;]*)"
            ));
            return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        // Function to set cookie
        function setCookie(name, value) {
            document.cookie = name + "=" + encodeURIComponent(value) + "; path=/";
        }

        const foreColorPicker = document.getElementById('foreground-color-picker');
        const backColorPicker = document.getElementById('background-color-picker');
        const linkColorPicker = document.getElementById('link-color-picker');

        // Update the color preferences when the user selects a color
        foreColorPicker.addEventListener('input', (event) => {
            const forecolor = event.target.value;
            setCookie('forecolor', forecolor);
            document.documentElement.style.setProperty('--foreground-color', forecolor);
        });

        backColorPicker.addEventListener('input', (event) => {
            const backcolor = event.target.value;
            setCookie('backcolor', backcolor);
            document.documentElement.style.setProperty('--background-color', backcolor);
        });

        linkColorPicker.addEventListener('input', (event) => {
            const linkcolor = event.target.value;
            setCookie('linkcolor', linkcolor);
            document.documentElement.style.setProperty('--link-color', linkcolor);
        });
        
        // Reset button functionality
        document.getElementById('reset-button').addEventListener('click', resetColors);

        // Function to reset colors to the original website styles
        function resetColors() {
            // Clear the cookies
            document.cookie = "forecolor=; path=/; max-age=0";
            document.cookie = "backcolor=; path=/; max-age=0";
            document.cookie = "linkcolor=; path=/; max-age=0";

            // Reset the colors by removing custom CSS variables
            document.documentElement.style.removeProperty('--foreground-color');
            document.documentElement.style.removeProperty('--background-color');
            document.documentElement.style.removeProperty('--link-color');

            // // Optionally, reset other styles like text or background color (if you're setting those in CSS)
            // document.body.style.color = '';  // Resets any inline styles for foreground
            // document.body.style.backgroundColor = '';  // Resets any inline styles for background

            // Reset the color pickers to their initial values
            document.getElementById('foreground-color-picker').value = '#000000';
            document.getElementById('background-color-picker').value = '#FFFFFF';
            document.getElementById('link-color-picker').value = '#3E8250';
        }

        // Apply saved colors on page load
        const savedForeColor = getCookie('forecolor');
        const savedBackColor = getCookie('backcolor');
        const savedLinkColor = getCookie('linkcolor');

        if (savedForeColor) {
            document.documentElement.style.setProperty('--foreground-color', savedForeColor);
            foreColorPicker.value = savedForeColor;
        }

        if (savedBackColor) {
            document.documentElement.style.setProperty('--background-color', savedBackColor);
            backColorPicker.value = savedBackColor;
        }

        if (savedLinkColor) {
            document.documentElement.style.setProperty('--link-color', savedLinkColor);
            linkColorPicker.value = savedLinkColor;
        }
    });
</script>

<h2>Color Picker</h2>
<p>Click on the color pickers below to select colors for the website.</p>
<div class="color-picker-container">
    <div class="row">
        <div class="col-label">
            <label for="color-picker">Foreground</label>
        </div>
        <div class ="col-color">
            <input type="color" id="foreground-color-picker" value="#000000">
        </div>
    </div>
    <div class="row">
        <div class="col-label">
            <label for="color-picker">Background</label>
        </div>
        <div class ="col-color">
            <input type="color" id="background-color-picker" value="#FFFFFF">
        </div>
    </div>
    <div class="row">
        <div class="col-label">
            <label for="color-picker">Linked Text</label>
        </div>
        <div class="col-color">
            <input type="color" id="link-color-picker" value="#3E8250">
        </div>
    </div>
    <div class="row">
    <div class="col-label"></div>
    <div class="col-color">
    <button id="reset-button">Reset Colors</button>
    </div>
    </div>
</div>
