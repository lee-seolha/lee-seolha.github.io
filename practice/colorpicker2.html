<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        /* Apply the color variables globally */
        :root {
            --foreground-color: #000;
            --background-color: #FFF;
        }

        body {
            color: var(--foreground-color);
            background-color: var(--background-color);
            font-family: Arial, sans-serif;
        }

        h1, h2, h3, h4, p, a {
            color: var(--foreground-color);
        }

        a:hover {
            color: var(--background-color);
        }

        /* Style for color pickers */
        .color-option {
            display: inline-block;
            width: 40px;
            height: 40px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Color Picker</h1>
    <h2>Choose Foreground Color</h2>
    <div id="foreground-color-options"></div>
    <h2>Choose Background Color</h2>
    <div id="background-color-options"></div>

    <script>
        // Function to get cookie value by name
        function getCookie(name) {
            let matches = document.cookie.match(new RegExp(
                "(?:^|; )" + name.replace(/([.$?*|{}()\[\]\/\\+^])/g, '\\$1') + "=([^;]*)"
            ));
            return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        // Function to set cookie
        function setCookie(name, value) {
            document.cookie = name + "=" + encodeURIComponent(value) + "; path=/";
        }

        // Set default colors or retrieve from cookies
        let forecolor = getCookie('forecolour') || '#000000';
        let backcolor = getCookie('backcolour') || '#FFFFFF';

        // Apply the colors to the page
        document.documentElement.style.setProperty('--foreground-color', forecolor);
        document.documentElement.style.setProperty('--background-color', backcolor);

        // Function to create color options
        function createColorOptions(containerId, colorType) {
            const colors = [];
            for (let r = 0; r <= 255; r += 51) {
                for (let g = 0; g <= 255; g += 51) {
                    for (let b = 0; b <= 255; b += 51) {
                        const color = `rgb(${r},${g},${b})`;
                        colors.push(color);
                    }
                }
            }

            const container = document.getElementById(containerId);
            colors.forEach(color => {
                const div = document.createElement('div');
                div.classList.add('color-option');
                div.style.backgroundColor = color;
                div.onclick = () => {
                    if (colorType === 'foreground') {
                        forecolor = color;
                        setCookie('forecolour', color);
                        document.documentElement.style.setProperty('--foreground-color', color);
                    } else {
                        backcolor = color;
                        setCookie('backcolour', color);
                        document.documentElement.style.setProperty('--background-color', color);
                    }
                };
                container.appendChild(div);
            });
        }

        // Create the color pickers
        createColorOptions('foreground-color-options', 'foreground');
        createColorOptions('background-color-options', 'background');
    </script>
</body>
</html>
