<body>
    <h2>Welcome to Lee's Office</h2>

    <h3>Choose your colors.</h3>
    <div class="color picker box" style="border: 1.50px solid olive;   border-radius: 5px; padding: 10px">
        <h4>Foreground:
            <span class="color-picker"><input type="color" id="foreground-color-picker" value="#000000"></span>
        </h4>
        <h4>Background:
            <span class="color-picker"> <input type="color" id="background-color-picker" value="#FFFFFF">        </span>
        </h4>
        <p>* Click on the color picker to select a color for the website.</p>
        <script>
            // Function to get cookie value by name
            function getCookie(name) {
                let matches = document.cookie.match(new RegExp(
                    "(?:^|; )" + name.replace(/([.$?*|{}()\[\]\/\\+^])/g, '\\$1') + "=([^;]*)"
                ));
                return matches ? decodeURIComponent(matches[1]) : undefined;
            }

            // Function to set cookie
            function setCookie(name, value) {
                document.cookie = name + "=" + encodeURIComponent(value) + "; path=/";
            }

            // Set default colors or retrieve from cookies
            let forecolor = getCookie('forecolour') || '#000000';
            let backcolor = getCookie('backcolour') || '#FFFFFF';

            // Apply the colors to the page
            document.documentElement.style.setProperty('--foreground-color', forecolor);
            document.documentElement.style.setProperty('--background-color', backcolor);

            // Get the color pickers and set their initial values
            const foreColorPicker = document.getElementById('foreground-color-picker');
            const backColorPicker = document.getElementById('background-color-picker');

            foreColorPicker.value = forecolor;
            backColorPicker.value = backcolor;

            // Update the color preferences when the user selects a color
            foreColorPicker.addEventListener('input', (event) => {
                forecolor = event.target.value;
                setCookie('forecolour', forecolor);
                document.documentElement.style.setProperty('--foreground-color', forecolor);
            });

            backColorPicker.addEventListener('input', (event) => {
                backcolor = event.target.value;
                setCookie('backcolour', backcolor);
                document.documentElement.style.setProperty('--background-color', backcolor);
            });
        </script>
    </div>
